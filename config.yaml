# TODO: add papers by configuration file
base_url: "https://arxiv.paperswithcode.com/api/v0/papers/"
user_name: "Vincentqyw"
repo_name: "cv-arxiv-daily"
show_authors: True
show_links: True
show_badge: True
max_results: 10

publish_readme: True
publish_gitpage: True
publish_wechat: False

# file paths
json_readme_path: './docs/cv-arxiv-daily.json'
json_gitpage_path: './docs/cv-arxiv-daily-web.json'
json_wechat_path: './docs/cv-arxiv-daily-wechat.json'

md_readme_path: 'README.md'
md_gitpage_path: './docs/index.md'
md_wechat_path: './docs/wechat.md'

# archive: README.md / index.md only keep the latest papers of each keyword
# (github stops rendering markdown beyond 512 KB), all papers are archived by
# year, one markdown per keyword: <archive_dir>/<year>/<Keyword>.md
max_papers_in_readme: 200
archive_readme_dir: './archive'
archive_gitpage_dir: './docs/archive'

# code links: PapersWithCode is gone, github repos are looked up from the paper's
# abstract, Hugging Face papers and GitHub code search (needs GITHUB_TOKEN, 10
# requests/min). The weekly update re-checks papers without code published within
# code_check_days (<= 0 for all), at most max_code_checks papers per run, least
# recently checked first; code_checks_path remembers when each paper was checked
code_check_days: 180
max_code_checks: 300
code_checks_path: './docs/code-checks.json'

# keywords to search, optional "categories" limit the arxiv categories (eg. cs.CV)
# of one keyword; a top-level "categories" would apply to all keywords
keywords:
    "SLAM": 
        filters: ["SLAM", "Visual Odometry"]
    "SFM":
        filters: ["SFM", "Structure from Motion"]
    "Visual Localization":
        filters: ["Visual Localization","Camera Localization",
                  "Camera Re-localisation","Loop Closure Detection",
                  "visual place recognition","image retrieval"]
    "Keypoint Detection":
        filters: ["Keypoint Detection", "Feature Descriptor"]
    "Image Matching":
        filters: ["Image Matching", "Keypoint Matching", 
                  "Line Segment Detection", "Local Feature Matching"]
    "NeRF":
        filters: ["NeRF"]
    "Gaussian Splatting":
        filters: ["Gaussian Splatting", "3DGS", "2DGS", "4DGS"]
    "3D Reconstruction":
        filters: ["VGGT", "DUSt3R", "MASt3R",
                  "Feed-forward 3D Reconstruction", "Feed-forward Reconstruction",
                  "Multi-view 3D Reconstruction", "3D Foundation Model"]
    "World Model":
        filters: ["World Model", "World Models", "World Simulator"]
        # "world model" is also a common term in NLP / databases etc., limit the arxiv categories
        categories: ["cs.CV", "cs.RO", "cs.AI", "cs.LG", "cs.CL"]
    "VLA and VLN":
        filters: ["Vision Language Action", "Vision Language Navigation",
                  "Vision and Language Navigation", "VLN"]
